version: '3.8'

services:
  redis:
    image: redis:7.4-alpine
    container_name: redis-workshop
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-workshop-insight
    ports:
      - "5540:5540"

volumes:
  redis-data:
